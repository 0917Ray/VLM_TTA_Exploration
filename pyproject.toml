[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-clip-baseline"
version = "0.1.0"
description = "CLIP zero-shot and Test-Time Prompt Tuning on ImageNet variants"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "torchvision>=0.15", "Pillow>=9", "PyYAML>=6", "tqdm>=4", "ftfy", "regex", "setuptools>=68,<81"]

[project.scripts]
clip-evaluate = "evaluate_clip_zeroshot:main"

[project.optional-dependencies]
data = ["gdown>=5"]
visualization = ["matplotlib>=3.6", "numpy>=1.23"]

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["evaluate_clip_zeroshot"]
