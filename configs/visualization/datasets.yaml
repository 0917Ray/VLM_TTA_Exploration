data_root: data/raw
output_root: runs/dataset_visualizations
class_index: configs/visualization/imagenet_class_index.json
datasets:
  - imagenetv2
  - imagenet-a
  - imagenet-r
  - imagenet-sketch

num_classes: 10
rows: 1
seed: 42
dpi: 300
figsize: [15, 3]
font_size: 10
title_font_size: 14
show_title: true
title_pad: 5
show_figure_title: false
figure_title_pad: 8
border_width: 2.2
border_color: '#3A3D42'
pad_inches: 0.05
